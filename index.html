<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Calculadora IBR Bancóldex - Pro</title>
<style>
  :root{
    --primary: #2563eb;
    --primary-dark: #1e40af;
    --surface: #f8fafc;
    --blue-light: #eff6ff;
    --blue-border: #bfdbfe;
    --accent-green: #16a34a;
    --green-light: #f0fdf4;
    --green-border: #bbf7d0;
    --danger: #dc2626;
    --danger-light: #fef2f2;
    --danger-border: #fecaca;
  }
  body{
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--surface);
    margin: 15px;
    color: #111827;
  }
  h1{ text-align:center; color:#0f172a; margin-bottom:20px; font-weight: 800; font-size: 1.5rem; }
  
  .card{
    max-width:1050px;
    margin:0 auto;
    background:#fff;
    border-radius:16px;
    box-shadow:0 10px 25px rgba(15,23,42,0.1);
    overflow: hidden;
  }

  .form-section {
    background: var(--blue-light);
    padding: 20px;
    border-bottom: 1px solid var(--blue-border);
  }
  
  form{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap:15px;
    align-items:end;
  }
  label{ display:block; font-weight:700; margin-bottom:6px; font-size:0.8rem; color:#1e40af; text-transform: uppercase; letter-spacing: 0.5px;}
  select, input{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--blue-border);
    font-size:0.95rem;
    box-sizing:border-box;
    background: #fff;
  }

  .modo-auto, .modo-manual { display: block; }
  .hidden { display: none !important; }

  .alert-error {
    margin: 15px 20px 0 20px;
    padding: 12px 16px;
    background: var(--danger-light);
    border: 1px solid var(--danger-border);
    border-radius: 10px;
    color: var(--danger);
    font-size: 0.85rem;
    font-weight: 700;
  }

  .info-container, .comparativa-container, .table-collapsible-container {
    margin: 20px;
    border-radius: 12px;
    background: #fff;
    overflow: hidden;
  }

  .info-container { border: 2px solid var(--blue-border); }
  .comparativa-container { border: 2px solid var(--green-border); margin-top:0; }
  .table-collapsible-container { border: 1px solid #e2e8f0; margin-top:0; }

  .info-summary, .comparativa-header, .table-header {
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    background: #fff;
    border: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
  }

  .comparativa-header { background: var(--green-light); }
  .table-header { background: #f8fafc; border-bottom: 1px solid #e2e8f0; }

  .summary-item { display: flex; flex-direction: column; }
  .summary-item strong { font-size: 0.8rem; color: var(--primary-dark); text-transform: uppercase; margin-bottom: 4px;}
  .summary-item span { font-size: 1.6rem; font-weight: 900; color: #0f172a; }

  .toggle-icon, .toggle-icon-comp, .toggle-icon-table {
    width: 24px;
    height: 24px;
    transition: transform 0.3s;
  }
  .toggle-icon { fill: var(--primary); }
  .toggle-icon-comp { fill: var(--accent-green); }
  .toggle-icon-table { fill: var(--primary); }

  .is-open .toggle-icon, .is-open-comp .toggle-icon-comp, .is-open-table .toggle-icon-table { transform: rotate(180deg); }

  .info-details {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease-out, opacity 0.3s;
    opacity: 0;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
  }
  .is-open .info-details {
    max-height: 350px;
    opacity: 1;
    padding-bottom: 20px;
    border-top: 1px solid var(--blue-light);
    padding-top: 15px;
  }

  .detail-item strong { display: block; font-size: 0.75rem; color: #64748b; text-transform: uppercase; margin-bottom: 2px; }
  .detail-item span { font-size: 0.95rem; font-weight: 700; color: #1e293b; }

  .comparativa-title, .table-title {
    font-size: 0.85rem;
    font-weight: 800;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .comparativa-title { color: var(--accent-green); }
  .table-title { color: var(--primary-dark); }

  .comparativa-body, .table-body-wrapper {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease-out, opacity 0.3s;
    opacity: 0;
  }

  .is-open-comp .comparativa-body {
    max-height: 500px;
    opacity: 1;
    padding: 16px;
    border-top: 1px solid var(--green-border);
  }

  .is-open-table .table-body-wrapper {
    max-height: 2000px;
    opacity: 1;
  }

  .comparativa-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
    gap: 10px;
  }

  .comparativa-card {
    background: #fff;
    padding: 10px 6px;
    border-radius: 8px;
    border: 1px solid var(--green-border);
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }
  .comparativa-card:hover {
    border-color: var(--accent-green);
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(22, 163, 74, 0.1);
  }
  .comparativa-card.selected {
    background: #dcfce7;
    border-color: var(--accent-green);
  }

  .comparativa-plazo { font-size: 0.75rem; font-weight: 700; color: #166534; text-transform: uppercase; }
  .comparativa-cuota { font-size: 0.95rem; font-weight: 900; color: #0f172a; margin-top: 4px; }

  .table-container { overflow-x: auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:10px 10px; text-align:right; font-size:0.82rem; border-bottom: 1px solid #f1f5f9; }
  thead th { background: var(--primary); color:#fff; font-weight: 600; }
  tfoot td { background: #f8fafc; font-weight: 800; color: var(--primary-dark); border-top: 2px solid var(--blue-border); }

  footer { text-align: center; margin-top: 25px; margin-bottom: 10px; font-size: 0.75rem; color: #64748b; font-weight: 600; }
</style>
</head>
<body>

  <h1>Simulador IBR Bancóldex Pro</h1>

  <div class="card">
    <div class="form-section">
      <form id="form">
        <!-- Control de Modo de Tasa -->
        <div>
          <label>Modo de Tasa</label>
          <select id="modoCalculo">
            <option value="AUTO">POR DESTINO</option>
            <option value="MANUAL">MANUAL (TASA BANCÓLDEX)</option>
          </select>
        </div>

        <!-- Campos para Modo Por Destino -->
        <div class="modo-auto">
          <label>Destino Comercial</label>
          <select id="destino">
            <option value="CAPITAL_TRABAJO">Capital de Trabajo</option>
            <option value="MODERNIZACION">Modernización Empresarial</option>
          </select>
        </div>

        <!-- Campos para Modo Manual -->
        <div class="modo-manual hidden">
          <label>Tasa Bancóldex (%)</label>
          <input id="spreadManual" type="number" step="0.01" min="0.01" placeholder="Ej: 28.76" />
        </div>

        <!-- Campos Comunes -->
        <div>
          <label>Monto Solicitado</label>
          <input id="monto" type="text" inputmode="numeric" placeholder="$0" required />
        </div>
        <div>
          <label>Plazo (Meses)</label>
          <input id="plazo" type="number" inputmode="numeric" min="1" max="60" value="12" required />
        </div>
        <div>
          <label>IBR Actual (%)</label>
          <input id="ibr" type="number" step="0.01" value="10.50" required />
        </div>
        <div>
          <label>¿Aplica MIPYME?</label>
          <select id="aplicaMipyme">
            <option value="SI">SÍ</option>
            <option value="NO">NO</option>
          </select>
        </div>
        <div>
          <label>Género (Seg. Vida)</label>
          <select id="genero">
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
          </select>
        </div>
        <div>
          <label>Edad (Seg. Vida)</label>
          <select id="edad"></select>
        </div>
      </form>
    </div>

    <!-- Panel de Alertas de Validación -->
    <div class="alert-error" id="alertaError" style="display:none;"></div>

    <!-- Bloque 1: Resumen de Cuota -->
    <div class="info-container" id="infoContainer" style="display:none;">
      <button type="button" class="info-summary" onclick="toggleDetails()">
        <span class="summary-item">
          <strong id="labelCuotaPlazo">Primera Cuota Aprox.</strong>
          <span id="cuotaInicial"></span>
        </span>
        <svg class="toggle-icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5H7z"/></svg>
      </button>
      
      <div class="info-details" id="infoDetails">
        <div class="detail-item"><strong>IBR + Tasa Bancóldex (EA)</strong><span id="tasaTotal"></span></div>
        <div class="detail-item"><strong>Abono a Capital Fijo</strong><span id="abonoCapital"></span></div>
        <div class="detail-item"><strong>Comisión MIPYME (Año 1)</strong><span id="mipymeMes1"></span></div>
        <div class="detail-item"><strong>Seguro de Vida (Mes)</strong><span id="seguroMensual"></span></div>
        <div class="detail-item"><strong>Interés (Mes 1)</strong><span id="interesMes1"></span></div>
        <div class="detail-item"><strong style="color: var(--primary);">Última Cuota Aprox.</strong><span id="ultimaCuota" style="color: var(--primary);"></span></div>
      </div>
    </div>

    <!-- Bloque 2: Comparativa de Plazos -->
    <div class="comparativa-container" id="comparativaContainer" style="display:none;">
      <button type="button" class="comparativa-header" onclick="toggleComparativa()">
        <span class="comparativa-title">⚡ Comparador de Plazos</span>
        <svg class="toggle-icon-comp" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5H7z"/></svg>
      </button>
      <div class="comparativa-body" id="comparativaBody">
        <div class="comparativa-grid" id="comparativaGrid"></div>
      </div>
    </div>

    <!-- Bloque 3: Tabla de Amortización -->
    <div class="table-collapsible-container" id="tablaContainerWrapper" style="display:none;">
      <button type="button" class="table-header" onclick="toggleTabla()">
        <span class="table-title">📊 Proyección de Pagos</span>
        <svg class="toggle-icon-table" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5H7z"/></svg>
      </button>
      <div class="table-body-wrapper" id="tablaBodyWrapper">
        <div class="table-container">
          <table id="tablaResultados">
            <thead>
              <tr>
                <th style="text-align:left">#</th>
                <th>Cuota Total</th>
                <th>Capital</th>
                <th>Interés</th>
                <th>MIPYME</th>
                <th>Seguro Vida</th>
                <th>Saldo</th>
              </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
              <tr id="filaTotales"></tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>

  </div>

<script>
const CONFIG = {
  LIMITES: { MIN: 10505431, MAX: 43772625 },
  SMMLV: 1750000,
  MIPYME_LIMITE_SMMLV: 4,
  SEGURO_VIDA_FACTORES: {
    M: { 
      18:0.377, 19:0.377, 20:0.377, 21:0.383, 22:0.390, 23:0.397, 24:0.404, 25:0.409, 26:0.415, 27:0.419, 28:0.426, 29:0.432, 30:0.437, 31:0.444, 32:0.451, 33:0.459, 
      34:0.469, 35:0.479, 36:0.479, 37:0.490, 38:0.502, 39:0.516, 40:0.532, 41:0.547, 42:0.565, 43:0.581, 44:0.600, 45:0.620, 46:0.641, 47:0.663, 48:0.693, 49:0.727, 
      50:0.765, 51:0.852, 52:0.909, 53:0.979, 54:1.060, 55:1.155, 56:1.158, 57:1.274, 58:1.410, 59:1.562, 60:1.727, 61:2.331, 62:2.542, 63:2.760, 64:2.968, 65:3.177, 
      66:3.382, 67:3.591, 68:3.866, 69:4.116, 70:4.397, 71:3.068, 72:3.347, 73:3.719, 74:4.194, 75:4.788, 76:5.520, 77:6.410, 78:7.507, 79:8.990, 80:10.937, 81:10.937, 
      82:10.937, 83:10.937, 84:10.937, 85:10.937 
    },
    F: { 
      18:0.377, 19:0.377, 20:0.377, 21:0.377, 22:0.377, 23:0.377, 24:0.377, 25:0.383, 26:0.383, 27:0.390, 28:0.397, 29:0.404, 30:0.409, 31:0.415, 32:0.419, 33:0.426, 
      34:0.432, 35:0.437, 36:0.444, 37:0.451, 38:0.459, 39:0.469, 40:0.479, 41:0.479, 42:0.490, 43:0.502, 44:0.516, 45:0.532, 46:0.547, 47:0.565, 48:0.581, 49:0.600, 
      50:0.620, 51:0.677, 52:0.699, 53:0.731, 54:0.767, 55:0.807, 56:0.852, 57:0.909, 58:0.979, 59:1.060, 60:1.155, 61:1.423, 62:1.566, 63:1.733, 64:1.920, 65:2.122, 
      66:2.331, 67:2.542, 68:2.760, 69:2.968, 70:3.177, 71:3.382, 72:3.591, 73:3.866, 74:4.116, 75:4.397, 76:3.068, 77:3.347, 78:3.719, 79:4.194, 80:4.788, 81:5.520, 
      82:6.410, 83:7.507, 84:8.990, 85:10.937 
    }
  }
};

const formatoCOP = (n) => "$" + Math.round(n).toLocaleString("es-CO");
const limpiarNumero = (v) => parseInt(String(v || "").replace(/[^\d]/g, "")) || 0;

function toggleDetails() { document.getElementById("infoContainer").classList.toggle("is-open"); }
function toggleComparativa() { document.getElementById("comparativaContainer").classList.toggle("is-open-comp"); }
function toggleTabla() { document.getElementById("tablaContainerWrapper").classList.toggle("is-open-table"); }

function alternarModoCalculo() {
  const modo = document.getElementById("modoCalculo").value;
  const autos = document.querySelectorAll(".modo-auto");
  const manuales = document.querySelectorAll(".modo-manual");

  if (modo === "MANUAL") {
    autos.forEach(el => el.classList.add("hidden"));
    manuales.forEach(el => el.classList.remove("hidden"));
  } else {
    autos.forEach(el => el.classList.remove("hidden"));
    manuales.forEach(el => el.classList.add("hidden"));
  }
}

(function populateEdadOptions(){
  const elEdad = document.getElementById("edad");
  const fragment = document.createDocumentFragment();
  for(let a=18; a<=85; a++){
    const o = document.createElement("option"); o.value = a; o.textContent = a;
    if(a === 30) o.selected = true; 
    fragment.appendChild(o);
  }
  elEdad.appendChild(fragment);
})();

function seleccionarPlazoRapido(nuevoPlazo) {
  document.getElementById("plazo").value = nuevoPlazo;
  calcularYRenderizar();
}

function obtenerSpread(destino, plazo) {
  if (destino === "CAPITAL_TRABAJO") {
    if (plazo <= 24) return 28.76;
    if (plazo <= 36) return 32.76;
    return null; // No permitido
  } else {
    if (plazo <= 24) return 30.49;
    if (plazo <= 36) return 34.49;
    if (plazo <= 48) return 35.99;
    if (plazo <= 60) return 36.59;
    return null;
  }
}

function calcularSeguroVida(monto, genero, edad, plazo) {
  const edadPonderada = Math.ceil(edad + (plazo / 24));
  const edadClave = Math.min(Math.max(edadPonderada, 18), 85);
  const factorBase = CONFIG.SEGURO_VIDA_FACTORES[genero]?.[edadClave] || 0.377;
  return Math.ceil(monto * (factorBase / 1000));
}

function calcularPrimeraCuotaAuxiliar(m, pl, dest, modo, spreadMan, ibr, g, e, pctM) {
  const spread = (modo === "AUTO") ? obtenerSpread(dest, pl) : spreadMan;
  if (spread === null) return null; // Plazo inválido para el destino
  
  const tasaEA = ibr + spread;
  const tem = Math.pow(1 + tasaEA/100, 1/12) - 1;
  const capitalFijo = m / pl;
  const seguroMensual = calcularSeguroVida(m, g, e, pl);
  const mipymeMes1 = m * (pctM * 1.19);
  const interesMes1 = m * tem;
  
  return capitalFijo + interesMes1 + mipymeMes1 + seguroMensual;
}

function calcularYRenderizar(){
  const modo = document.getElementById("modoCalculo").value;
  const dest = document.getElementById("destino").value;
  const spreadMan = parseFloat(document.getElementById("spreadManual").value) || 0;
  const ibr = parseFloat(document.getElementById("ibr").value) || 0;
  const m = limpiarNumero(document.getElementById("monto").value);
  const pl = parseInt(document.getElementById("plazo").value) || 0;
  const g = document.getElementById("genero").value;
  const e = parseInt(document.getElementById("edad").value) || 0;
  const aplicaM = document.getElementById("aplicaMipyme").value === "SI";

  const elAlerta = document.getElementById("alertaError");
  elAlerta.style.display = "none";
  let errores = [];

  // Validaciones
  if (m > 0 && (m < CONFIG.LIMITES.MIN || m > CONFIG.LIMITES.MAX)) {
    errores.push(`Monto fuera de rango de Bancóldex ($${(CONFIG.LIMITES.MIN/1000000).toFixed(1)}M a $${(CONFIG.LIMITES.MAX/1000000).toFixed(1)}M).`);
  }

  let spread = (modo === "AUTO") ? obtenerSpread(dest, pl) : spreadMan;
  
  if (modo === "AUTO" && pl > 0 && spread === null) {
    errores.push(`El plazo de ${pl} meses no está permitido para ${dest === 'CAPITAL_TRABAJO' ? 'Capital de Trabajo (Max. 36)' : 'Modernización'}.`);
  } else if (modo === "MANUAL" && spreadMan <= 0) {
    errores.push("Ingresa una Tasa Bancóldex válida.");
  }

  if (errores.length > 0) {
    elAlerta.innerHTML = `⚠️ ${errores.join("<br>")}`;
    elAlerta.style.display = "block";
    document.getElementById("infoContainer").style.display="none";
    document.getElementById("comparativaContainer").style.display="none";
    document.getElementById("tablaContainerWrapper").style.display="none";
    return;
  }

  if(!m || !pl || !ibr) return;

  const limiteSmmlv = CONFIG.SMMLV * CONFIG.MIPYME_LIMITE_SMMLV;
  const pctMipyme = aplicaM ? (m <= limiteSmmlv ? 0.006045 : 0.003675) : 0;

  // Renderizar Comparativa
  const plazosComparativa = [6, 12, 18, 24, 30, 36, 48, 60];
  const gridComp = document.getElementById("comparativaGrid");
  let botonesHtml = "";
  
  plazosComparativa.forEach(pMeses => {
    const cuotaComp = calcularPrimeraCuotaAuxiliar(m, pMeses, dest, modo, spreadMan, ibr, g, e, pctMipyme);
    if (cuotaComp !== null) {
      botonesHtml += `
        <button type="button" class="comparativa-card ${pMeses === pl ? 'selected' : ''}" onclick="seleccionarPlazoRapido(${pMeses})">
          <div class="comparativa-plazo">${pMeses} Meses</div>
          <div class="comparativa-cuota">${formatoCOP(cuotaComp)}</div>
        </button>
      `;
    }
  });
  gridComp.innerHTML = botonesHtml;
  document.getElementById("comparativaContainer").style.display="block";

  // Cálculos principales
  const tasaEA = ibr + spread;
  const tem = Math.pow(1 + tasaEA/100, 1/12) - 1;
  const capitalFijo = m / pl;
  const seguroMensual = calcularSeguroVida(m, g, e, pl);

  let saldo = m;
  let baseMipymeAnual = m, proximaBaseMipyme = m;
  let totalCuota = 0, totalCapital = 0, totalInteres = 0, totalMipyme = 0, totalSeguro = 0;
  let primeraCuotaFinal = 0, ultimaCuota = 0, mipymeMes1 = 0, interesMes1 = 0;

  const filasHTML = [];

  for(let i=1; i<=pl; i++){
    // Anualización MIPYME: Actualizar base en los meses 13, 25, 37...
    if (i > 1 && (i - 1) % 12 === 0) {
      baseMipymeAnual = proximaBaseMipyme;
    }

    const interes = saldo * tem;
    const mipymeMes = aplicaM ? (baseMipymeAnual * (pctMipyme * 1.19)) : 0;
    const cuotaTotalMes = capitalFijo + interes + mipymeMes + seguroMensual;
    
    if(i === 1) {
      primeraCuotaFinal = cuotaTotalMes;
      mipymeMes1 = mipymeMes;
      interesMes1 = interes;
    }
    if(i === pl) ultimaCuota = cuotaTotalMes;

    totalCuota += cuotaTotalMes; 
    totalCapital += capitalFijo; 
    totalInteres += interes;
    totalMipyme += mipymeMes; 
    totalSeguro += seguroMensual;

    filasHTML.push(`
      <tr>
        <td style="text-align:left">${i}</td>
        <td style="font-weight:700">${formatoCOP(cuotaTotalMes)}</td>
        <td>${formatoCOP(capitalFijo)}</td>
        <td>${formatoCOP(interes)}</td>
        <td>${formatoCOP(mipymeMes)}</td>
        <td>${formatoCOP(seguroMensual)}</td>
        <td>${formatoCOP(Math.max(0, saldo - capitalFijo))}</td>
      </tr>
    `);
    
    saldo -= capitalFijo;
    
    // Guardar el saldo al final del mes 12, 24, 36... para aplicarlo al año siguiente
    if (i % 12 === 0) {
      proximaBaseMipyme = saldo;
    }
  }

  document.querySelector("#tablaResultados tbody").innerHTML = filasHTML.join("");

  document.getElementById("infoContainer").style.display="block";
  document.getElementById("labelCuotaPlazo").textContent = `💰 Primera Cuota Aprox. (${pl} Meses)`;
  document.getElementById("cuotaInicial").textContent = formatoCOP(primeraCuotaFinal);
  document.getElementById("tasaTotal").textContent = `${ibr.toFixed(2)}% IBR + ${spread.toFixed(2)}% = ${tasaEA.toFixed(2)}% EA`;
  document.getElementById("abonoCapital").textContent = formatoCOP(capitalFijo);
  document.getElementById("mipymeMes1").textContent = formatoCOP(mipymeMes1);
  document.getElementById("seguroMensual").textContent = formatoCOP(seguroMensual);
  document.getElementById("interesMes1").textContent = formatoCOP(interesMes1);
  document.getElementById("ultimaCuota").textContent = formatoCOP(ultimaCuota);

  document.getElementById("filaTotales").innerHTML = `<td style="text-align:left">TOTAL</td><td>${formatoCOP(totalCuota)}</td><td>${formatoCOP(totalCapital)}</td><td>${formatoCOP(totalInteres)}</td><td>${formatoCOP(totalMipyme)}</td><td>${formatoCOP(totalSeguro)}</td><td>-</td>`;
  document.getElementById("tablaContainerWrapper").style.display="block";
}

document.getElementById("form").addEventListener("input", (e) => {
  if (e.target.id === "modoCalculo") {
    alternarModoCalculo();
  }
  if (e.target.id === "monto") {
    const v = limpiarNumero(e.target.value);
    e.target.value = v ? formatoCOP(v) : "";
  }
  calcularYRenderizar();
});

document.getElementById("form").addEventListener("change", (e) => {
  if (e.target.id === "modoCalculo" || e.target.id === "destino") {
    calcularYRenderizar();
  }
});
</script>
</body>
</html>
